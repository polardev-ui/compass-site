<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Proxy | compassplate</title>
    <link rel="icon" type="image/gif" href="/compass.gif">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* height (not just min-height) so percentage heights inside the flex chain
       resolve; with min-height alone every flex:1 descendant stays indefinite
       and the iframe's height:100% collapses to the default 150px. */
    html, body {
        height: 100%;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
    }

    .navbar {
        background: #000;
        border-bottom: 1px solid #333;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar-brand {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
    }

    .back-link {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 12px;
        border: 1px solid #fff;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .back-link:hover {
        background-color: #fff;
        color: #000;
    }

    .header {
        background: #000;
        border-bottom: 1px solid #333;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .nav-buttons {
        display: flex;
        gap: 8px;
    }

    .nav-btn {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: #000;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
        background-color: #fff;
        color: #000;
    }

    .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .address-bar {
        flex: 1;
        min-width: 250px;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .url-input {
        flex: 1;
        padding: 8px 12px;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
        color: #fff;
        font-size: 14px;
    }

    .url-input::placeholder {
        color: #666;
    }

    .url-input:focus {
        outline: none;
        border-color: #fff;
        background: #1a1a1a;
    }

    .go-btn {
        padding: 8px 16px;
        background: #ff0000;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
    }

    .go-btn:hover {
        background: #cc0000;
    }

    .content-wrapper {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .proxy-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }

    .proxy-content {
        flex: 1;
        overflow: auto;
        position: relative;
        background: #fff;
        min-height: 0;
    }

    .proxy-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
        display: block;
    }

    .proxy-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        text-align: center;
        flex-direction: column;
        gap: 16px;
    }

    .proxy-empty-icon {
        font-size: 48px;
    }

    .proxy-empty-text {
        font-size: 16px;
    }

    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .loading-spinner {
        font-size: 48px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
        .header {
            flex-direction: column;
            align-items: stretch;
        }

        .address-bar {
            width: 100%;
        }

        .content-wrapper {
            padding: 10px;
        }
    }
    </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">compassplate | proxy</div>
        <a href="/pages/proxy/checks.html" class="back-link">← checks</a>
    </div>

    <div class="header">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" title="Back">←</button>
            <button class="nav-btn" id="forwardBtn" title="Forward">→</button>
            <button class="nav-btn" id="reloadBtn" title="Reload">⟳</button>
        </div>
        <div class="address-bar">
            <input type="text" class="url-input" id="urlInput" placeholder="Search, or enter a URL...">
            <button class="go-btn" id="goBtn">GO</button>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="proxy-container">
            <div class="proxy-content" id="proxyContent">
                <div class="proxy-empty">
                    <div class="proxy-empty-icon">🌐</div>
                    <div class="proxy-empty-text">Enter a URL to proxy</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const PROXY_PREFIX = '/api/p/';
    const SEARCH_PATH = '/api/search';

    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const navBackBtn = document.getElementById('backBtn');
    const navForwardBtn = document.getElementById('forwardBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const proxyContent = document.getElementById('proxyContent');

    // Session history lives here rather than in the iframe: the DOM exposes no
    // way to ask an iframe whether it can go back. Each entry is the path we
    // load into the frame plus what the address bar should show for it.
    let entries = [];          // [{ path, display }]
    let index = -1;
    let frame = null;
    let pendingNav = false;    // a navigation we started is in flight
    let urlDirty = false;      // user is editing the address bar
    let currentOrigin = null;
    let lastRecovery = 0;
    let recoveryTimes = [];

    function encodeOrigin(origin) {
        return btoa(origin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeOrigin(segment) {
        return atob(segment.replace(/-/g, '+').replace(/_/g, '/'));
    }

    function isProxyPath(pathname) {
        if (!pathname.startsWith(PROXY_PREFIX)) return false;
        const segment = pathname.slice(PROXY_PREFIX.length).split('/')[0];
        try {
            return /^https?:\/\/[^/]+$/i.test(decodeOrigin(segment));
        } catch (err) {
            return false;
        }
    }

    function toProxyPath(absoluteUrl) {
        const u = new URL(absoluteUrl);
        // Already in proxy space (e.g. re-submitting what the URL bar shows).
        if (isProxyPath(u.pathname)) return u.pathname + u.search + u.hash;
        return PROXY_PREFIX + encodeOrigin(u.origin) + u.pathname + u.search + u.hash;
    }

    function fromProxyPath(pathWithQuery) {
        if (!pathWithQuery.startsWith(PROXY_PREFIX)) return null;
        const rest = pathWithQuery.slice(PROXY_PREFIX.length);
        const slash = rest.indexOf('/');
        const segment = slash === -1 ? rest : rest.slice(0, slash);
        const tail = slash === -1 ? '/' : rest.slice(slash);
        try {
            return decodeOrigin(segment) + tail;
        } catch (err) {
            return null;
        }
    }

    // Unwraps a proxy path back to the real URL, however many layers deep.
    function unwrap(url) {
        for (let i = 0; i < 5; i++) {
            let u;
            try { u = new URL(url); } catch (err) { return url; }
            if (!isProxyPath(u.pathname)) return url;
            const real = fromProxyPath(u.pathname + u.search + u.hash);
            if (!real || real === url) return url;
            url = real;
        }
        return url;
    }

    // Anything that is not plausibly an address is treated as a search, the way
    // a browser's omnibox does.
    function looksLikeUrl(text) {
        if (/^https?:\/\//i.test(text)) return true;
        if (/\s/.test(text)) return false;
        const host = text.split(/[\/?#]/)[0];
        return /^[a-z0-9-]+(\.[a-z0-9-]+)+\.?(:\d+)?$/i.test(host) || /^localhost(:\d+)?$/i.test(host);
    }

    function searchEntry(query) {
        return { path: SEARCH_PATH + '?q=' + encodeURIComponent(query), display: query };
    }

    // The service worker is scoped to /api/p/ so it only intercepts requests
    // made by proxied pages, never the rest of the site. Without it, a proxied
    // page's root-relative and cross-origin subresources would go straight to
    // this origin (404) or to the real host (CORS-blocked).
    let workerReady = null;

    function ensureServiceWorker() {
        if (workerReady) return workerReady;

        if (!('serviceWorker' in navigator)) {
            workerReady = Promise.resolve(false);
            return workerReady;
        }

        workerReady = navigator.serviceWorker
            .register(PROXY_PREFIX + 'sw.js', { scope: PROXY_PREFIX })
            .then(registration => new Promise(resolve => {
                if (registration.active) return resolve(true);
                const worker = registration.installing || registration.waiting;
                if (!worker) return resolve(false);
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'activated') resolve(true);
                });
            }))
            .catch(() => false);

        return workerReady;
    }

    function showMessage(icon, text) {
        proxyContent.innerHTML = `
            <div class="proxy-empty">
                <div class="proxy-empty-icon">${icon}</div>
                <div class="proxy-empty-text">${text}</div>
            </div>
        `;
        frame = null;
    }

    function setLoading(on) {
        const existing = proxyContent.querySelector('.loading-overlay');
        if (!on) {
            if (existing) existing.remove();
            return;
        }
        if (existing) return;
        const overlay = document.createElement('div');
        overlay.className = 'loading-overlay';
        overlay.innerHTML = '<div class="loading-spinner">⟳</div>';
        proxyContent.appendChild(overlay);
    }

    // One long-lived iframe: recreating it per navigation threw away the
    // in-frame session state and made every load a cold start.
    function ensureFrame() {
        if (frame && frame.isConnected) return frame;

        proxyContent.innerHTML = '';
        frame = document.createElement('iframe');
        frame.className = 'proxy-frame';
        frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
        frame.addEventListener('load', () => {
            pendingNav = false;
            setLoading(false);
            syncAddressBar();
        });
        proxyContent.appendChild(frame);
        return frame;
    }

    function setAddressBar(value) {
        // Never clobber what the user is in the middle of typing.
        if (document.activeElement === urlInput || urlDirty) return;
        urlInput.value = value;
    }

    function updateNavButtons() {
        navBackBtn.disabled = index <= 0;
        navForwardBtn.disabled = index >= entries.length - 1;
    }

    function loadEntry(entry) {
        if (!entry) return;

        if (entry.display && /^https?:\/\//i.test(entry.display)) {
            try { currentOrigin = new URL(entry.display).origin; } catch (err) { /* keep previous */ }
        }

        pendingNav = true;
        setAddressBar(entry.display);
        ensureFrame();
        setLoading(true);
        frame.src = entry.path;
        updateNavButtons();
    }

    function pushEntry(entry) {
        // A fresh navigation truncates anything ahead, like a real browser.
        entries = entries.slice(0, index + 1);
        entries.push(entry);
        index = entries.length - 1;
    }

    async function proxyUrl(rawInput) {
        const text = rawInput.trim();
        if (!text) return;

        urlDirty = false;
        urlInput.blur();   // otherwise setAddressBar keeps deferring to the user
        await ensureServiceWorker();

        if (!looksLikeUrl(text)) {
            pushEntry(searchEntry(text));
            loadEntry(entries[index]);
            return;
        }

        let url = text;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        url = unwrap(url);

        let path;
        try {
            path = toProxyPath(url);
        } catch (err) {
            showMessage('❌', 'Not a valid URL');
            return;
        }

        pushEntry({ path: path, display: url });
        loadEntry(entries[index]);
    }

    function goBack() {
        if (index <= 0) return;
        index--;
        loadEntry(entries[index]);
    }

    function goForward() {
        if (index >= entries.length - 1) return;
        index++;
        loadEntry(entries[index]);
    }

    function reloadCurrent() {
        if (index < 0) return;
        loadEntry(entries[index]);
    }

    // Describes wherever the frame currently is, or null if it has escaped.
    function frameLocation() {
        if (!frame) return null;

        let inner;
        try {
            inner = frame.contentWindow.location;
        } catch (err) {
            return undefined; /* not readable yet */
        }

        const path = inner.pathname + inner.search;

        if (inner.pathname.startsWith(PROXY_PREFIX)) {
            const real = fromProxyPath(inner.pathname + inner.search + inner.hash);
            return real ? { path: path, display: real, inner: inner } : undefined;
        }

        if (inner.pathname === SEARCH_PATH) {
            const q = new URLSearchParams(inner.search).get('q') || '';
            return { path: path, display: q, inner: inner };
        }

        return { escaped: true, inner: inner };
    }

    // Records navigations that originate inside the frame (link clicks, form
    // submits, SPA routing) so Back reaches them, and keeps the URL bar honest.
    //
    // Some sites assign to location directly (e.g. location.href = '/').
    // location is unforgeable, so no in-page shim can catch that; the frame
    // lands on this origin instead and would render our 404. Detect that here
    // and pull it back onto the site it was really trying to reach.
    function syncAddressBar() {
        const here = frameLocation();
        if (here === null || here === undefined) return;

        if (here.escaped) {
            const inner = here.inner;
            const now = Date.now();
            if (!currentOrigin || inner.origin !== location.origin) return;
            if (now - lastRecovery <= 1500) return;

            // The window is the only thing that clears this: resetting it
            // whenever the frame is back in proxy space meant every
            // escape/recover cycle wiped the counter and the cap never fired.
            recoveryTimes = recoveryTimes.filter(t => now - t < 20000);
            const escaped = inner.pathname + inner.search;
            console.warn('[proxy] frame escaped to', escaped);
            if (recoveryTimes.length >= 3) {
                showMessage('⚠️', 'This site keeps navigating out of the proxy (' + escaped + '). Stopped reloading it.');
                recoveryTimes = [];
                lastRecovery = now + 60000;   // stay stopped
                return;
            }
            recoveryTimes.push(now);

            lastRecovery = now;
            pendingNav = true;
            frame.src = PROXY_PREFIX + encodeOrigin(currentOrigin) + inner.pathname + inner.search;
            return;
        }

        setAddressBar(here.display);
        if (/^https?:\/\//i.test(here.display)) {
            try { currentOrigin = new URL(here.display).origin; } catch (err) { /* keep previous */ }
        }

        // While our own navigation is in flight the frame may still be showing
        // the previous page; recording it would corrupt the stack.
        if (pendingNav) return;

        if (!entries[index] || entries[index].path !== here.path) {
            pushEntry({ path: here.path, display: here.display });
            updateNavButtons();
        }
    }

    setInterval(syncAddressBar, 700);

    urlInput.addEventListener('input', () => { urlDirty = true; });

    urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            proxyUrl(urlInput.value);
        } else if (e.key === 'Escape') {
            urlDirty = false;
            if (index >= 0) urlInput.value = entries[index].display;
            urlInput.blur();
        }
    });

    goBtn.addEventListener('click', () => proxyUrl(urlInput.value));
    navBackBtn.addEventListener('click', goBack);
    navForwardBtn.addEventListener('click', goForward);
    reloadBtn.addEventListener('click', reloadCurrent);

    updateNavButtons();
    ensureServiceWorker();
    </script>
</body>
</html>
