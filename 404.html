<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | compassplate</title>
    <link rel="icon" type="image/gif" href="/compass.gif">
    <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      background-color: black;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .anchor-logo {
        height: 80px;
        width: 80px;
        margin-bottom: 20px;
    }

    h1 {
        margin: 10px 0;
        font-size: 2.5rem;
    }

    p {
        color: #888;
        margin-bottom: 30px;
    }

    .back-btn {
        background: none;
        border: 2px solid white;
        color: white;
        padding: 10px 20px;
        cursor: pointer;
        font-size: 1.1em;
        border-radius: 5px;
        transition: background 0.3s, color 0.3s;
    }

    .back-btn:hover {
        background: white;
        color: black;
    }

    .footer {
        position: absolute;
        bottom: 10px;
        font-size: 0.9em;
        color: #555;
    }
    </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

    <img src="/compass.gif" alt="logo" class="anchor-logo">

    <h1>you need a map bro?</h1>

    <p>how the hell did you end up here..? not even the compass can find where you are... whatever, just go back.</p>

    <button class="back-btn">go back</button>

    <!--- yes this is legit js for show, thought it looked cool... don't judge me man --->
    <p class="footer">404 Page Not Found - <span id="request-id"></span></p>

    <script>
    const backButton = document.querySelector('.back-btn');
    const requestIdEl = document.querySelector('#request-id');

    // a-z 0-9 random string generator for request id, does jackshit
    function generateRequestId(length = 16) {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let id = '';

        for (let i = 0; i < length; i++) {
            id += chars.charAt(Math.floor(Math.random() * chars.length));
        }

        return id;
    }

    requestIdEl.textContent = generateRequestId(16);

    backButton.addEventListener('click', () => {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '/index.html';
        }
    });
    </script>
</body>
</html>
