<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Proxy | compassplate</title>
    <link rel="icon" type="image/gif" href="/compass.gif">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* height (not just min-height) so percentage heights inside the flex chain
       resolve; with min-height alone every flex:1 descendant stays indefinite
       and the iframe's height:100% collapses to the default 150px. */
    html, body {
        height: 100%;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
    }

    .navbar {
        background: #000;
        border-bottom: 1px solid #333;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar-brand {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
    }

    .back-link {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 12px;
        border: 1px solid #fff;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .back-link:hover {
        background-color: #fff;
        color: #000;
    }

    .header {
        background: #000;
        border-bottom: 1px solid #333;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .nav-buttons {
        display: flex;
        gap: 8px;
    }

    .nav-btn {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: #000;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
        background-color: #fff;
        color: #000;
    }

    .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .address-bar {
        flex: 1;
        min-width: 250px;
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .url-input {
        flex: 1;
        padding: 8px 12px;
        background: #111;
        border: 1px solid #333;
        border-radius: 4px;
        color: #fff;
        font-size: 14px;
    }

    .url-input::placeholder {
        color: #666;
    }

    .url-input:focus {
        outline: none;
        border-color: #fff;
        background: #1a1a1a;
    }

    .go-btn {
        padding: 8px 16px;
        background: #ff0000;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
    }

    .go-btn:hover {
        background: #cc0000;
    }

    .content-wrapper {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .proxy-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }

    .proxy-content {
        flex: 1;
        overflow: auto;
        position: relative;
        background: #fff;
        min-height: 0;
    }

    .proxy-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
        display: block;
    }

    .proxy-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        text-align: center;
        flex-direction: column;
        gap: 16px;
    }

    .proxy-empty-icon {
        font-size: 48px;
    }

    .proxy-empty-text {
        font-size: 16px;
    }

    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .loading-spinner {
        font-size: 48px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
        .header {
            flex-direction: column;
            align-items: stretch;
        }

        .address-bar {
            width: 100%;
        }

        .content-wrapper {
            padding: 10px;
        }
    }
    </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">compassplate | proxy</div>
        <a href="/pages/proxy/checks.html" class="back-link">← checks</a>
    </div>

    <div class="header">
        <div class="nav-buttons">
            <button class="nav-btn" id="backBtn" title="Back">←</button>
            <button class="nav-btn" id="forwardBtn" title="Forward">→</button>
            <button class="nav-btn" id="reloadBtn" title="Reload">⟳</button>
        </div>
        <div class="address-bar">
            <input type="text" class="url-input" id="urlInput" placeholder="Enter URL to proxy...">
            <button class="go-btn" id="goBtn">GO</button>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="proxy-container">
            <div class="proxy-content" id="proxyContent">
                <div class="proxy-empty">
                    <div class="proxy-empty-icon">🌐</div>
                    <div class="proxy-empty-text">Enter a URL to proxy</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const PROXY_PREFIX = '/api/p/';

    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const navBackBtn = document.getElementById('backBtn');
    const navForwardBtn = document.getElementById('forwardBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const proxyContent = document.getElementById('proxyContent');

    let urlHistory = [];
    let currentHistoryIndex = -1;
    let frame = null;

    function encodeOrigin(origin) {
        return btoa(origin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeOrigin(segment) {
        return atob(segment.replace(/-/g, '+').replace(/_/g, '/'));
    }

    function isProxyPath(pathname) {
        if (!pathname.startsWith(PROXY_PREFIX)) return false;
        const segment = pathname.slice(PROXY_PREFIX.length).split('/')[0];
        try {
            return /^https?:\/\/[^/]+$/i.test(decodeOrigin(segment));
        } catch (err) {
            return false;
        }
    }

    function toProxyPath(absoluteUrl) {
        const u = new URL(absoluteUrl);
        // Already in proxy space (e.g. re-submitting what the URL bar shows).
        if (isProxyPath(u.pathname)) return u.pathname + u.search + u.hash;
        return PROXY_PREFIX + encodeOrigin(u.origin) + u.pathname + u.search + u.hash;
    }

    // Unwraps a proxy path back to the real URL, however many layers deep.
    function unwrap(url) {
        for (let i = 0; i < 5; i++) {
            let u;
            try { u = new URL(url); } catch (err) { return url; }
            if (!isProxyPath(u.pathname)) return url;
            const real = fromProxyPath(u.pathname + u.search + u.hash);
            if (!real || real === url) return url;
            url = real;
        }
        return url;
    }

    function fromProxyPath(pathWithQuery) {
        if (!pathWithQuery.startsWith(PROXY_PREFIX)) return null;
        const rest = pathWithQuery.slice(PROXY_PREFIX.length);
        const slash = rest.indexOf('/');
        const segment = slash === -1 ? rest : rest.slice(0, slash);
        const tail = slash === -1 ? '/' : rest.slice(slash);
        try {
            return decodeOrigin(segment) + tail;
        } catch (err) {
            return null;
        }
    }

    // The service worker is scoped to /api/p/ so it only intercepts requests
    // made by proxied pages, never the rest of the site. Without it, a proxied
    // page's root-relative and cross-origin subresources would go straight to
    // this origin (404) or to the real host (CORS-blocked).
    let workerReady = null;

    function ensureServiceWorker() {
        if (workerReady) return workerReady;

        if (!('serviceWorker' in navigator)) {
            workerReady = Promise.resolve(false);
            return workerReady;
        }

        workerReady = navigator.serviceWorker
            .register(PROXY_PREFIX + 'sw.js', { scope: PROXY_PREFIX })
            .then(registration => new Promise(resolve => {
                if (registration.active) return resolve(true);
                const worker = registration.installing || registration.waiting;
                if (!worker) return resolve(false);
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'activated') resolve(true);
                });
            }))
            .catch(() => false);

        return workerReady;
    }

    function showMessage(icon, text) {
        proxyContent.innerHTML = `
            <div class="proxy-empty">
                <div class="proxy-empty-icon">${icon}</div>
                <div class="proxy-empty-text">${text}</div>
            </div>
        `;
        frame = null;
    }

    // The proxied document is same-origin, so its address can be read back and
    // mirrored into the URL bar as the user clicks around inside the frame.
    //
    // Some sites assign to location directly (e.g. `location.href = '/'`).
    // `location` is unforgeable, so no in-page shim can catch that; the frame
    // lands on this origin instead and would render our 404. Detect that here
    // and pull it back onto the site it was really trying to reach.
    let currentOrigin = null;
    let lastRecovery = 0;

    function syncAddressBar() {
        if (!frame) return;

        let inner;
        try {
            inner = frame.contentWindow.location;
        } catch (err) {
            return; /* frame not readable yet */
        }

        if (!inner.pathname.startsWith(PROXY_PREFIX)) {
            const now = Date.now();
            if (currentOrigin && inner.origin === location.origin && now - lastRecovery > 1500) {
                lastRecovery = now;
                frame.src = PROXY_PREFIX + encodeOrigin(currentOrigin) + inner.pathname + inner.search;
            }
            return;
        }

        const real = fromProxyPath(inner.pathname + inner.search + inner.hash);
        if (real) {
            urlInput.value = real;
            try { currentOrigin = new URL(real).origin; } catch (err) { /* keep previous */ }
        }
    }

    async function proxyUrl(url, { record = true } = {}) {
        if (!url.match(/^https?:\/\//i)) {
            url = 'https://' + url;
        }
        url = unwrap(url);

        let proxyPath;
        try {
            proxyPath = toProxyPath(url);
        } catch (err) {
            showMessage('❌', 'Not a valid URL');
            return;
        }

        urlInput.value = url;
        try { currentOrigin = new URL(url).origin; } catch (err) { /* validated below */ }

        proxyContent.innerHTML = '';
        const loadingOverlay = document.createElement('div');
        loadingOverlay.className = 'loading-overlay';
        loadingOverlay.innerHTML = '<div class="loading-spinner">⟳</div>';

        await ensureServiceWorker();

        frame = document.createElement('iframe');
        frame.className = 'proxy-frame';
        frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
        frame.addEventListener('load', () => {
            if (loadingOverlay.parentNode) loadingOverlay.remove();
            syncAddressBar();
        });

        proxyContent.style.position = 'relative';
        proxyContent.appendChild(frame);
        proxyContent.appendChild(loadingOverlay);

        frame.src = proxyPath;

        if (record) {
            urlHistory = urlHistory.slice(0, currentHistoryIndex + 1);
            urlHistory.push(url);
            currentHistoryIndex = urlHistory.length - 1;
        }
        updateNavButtons();
    }

    function updateNavButtons() {
        navBackBtn.disabled = currentHistoryIndex <= 0;
        navForwardBtn.disabled = currentHistoryIndex >= urlHistory.length - 1;
    }

    // Keep the URL bar honest while the user navigates inside the frame.
    setInterval(syncAddressBar, 700);

    goBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (url) proxyUrl(url);
    });

    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const url = urlInput.value.trim();
            if (url) proxyUrl(url);
        }
    });

    navBackBtn.addEventListener('click', () => {
        if (frame && frame.contentWindow && frame.contentWindow.history.length > 1) {
            frame.contentWindow.history.back();
            return;
        }
        if (currentHistoryIndex > 0) {
            currentHistoryIndex--;
            proxyUrl(urlHistory[currentHistoryIndex], { record: false });
        }
    });

    navForwardBtn.addEventListener('click', () => {
        if (currentHistoryIndex < urlHistory.length - 1) {
            currentHistoryIndex++;
            proxyUrl(urlHistory[currentHistoryIndex], { record: false });
        }
    });

    reloadBtn.addEventListener('click', () => {
        if (currentHistoryIndex >= 0) {
            proxyUrl(urlHistory[currentHistoryIndex], { record: false });
        }
    });

    updateNavButtons();
    ensureServiceWorker();
    </script>
</body>
</html>
